<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJU BERSAMA RVS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="app">
        <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
                <div class="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="shield-check" class="text-indigo-600 w-10 h-10"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800">OWNER LOGIN</h1>
                <p class="text-slate-500 mb-6">MAJU BERSAMA RVS</p>
                <input type="password" id="admin-key" class="w-full p-3 bg-slate-100 border-none rounded-xl mb-4 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Kunci Akses Owner">
                <button onclick="checkAdmin()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-all">MASUK KE SISTEM</button>
            </div>
        </div>

        <div id="main-dashboard" class="hidden">
            <nav class="bg-indigo-900 text-white p-4 sticky top-0 z-50">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <span class="text-xl font-black italic">MAJU BERSAMA RVS</span>
                    <button onclick="location.reload()" class="text-sm bg-red-500 px-3 py-1 rounded-lg">Keluar</button>
                </div>
            </nav>

            <main class="max-w-7xl mx-auto px-4 py-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-indigo-600">
                        <p class="text-slate-400 text-xs font-bold uppercase">Total Dana Member</p>
                        <p id="stat-profit" class="text-2xl font-black text-slate-800">Rp 0</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <p class="text-slate-400 text-xs font-bold uppercase">Total Anggota</p>
                        <p id="stat-members" class="text-2xl font-black text-slate-800">0 Orang</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="user-plus" class="text-indigo-600"></i> Registrasi</h2>
                        <div class="space-y-4">
                            <input id="reg-name" class="w-full p-3 bg-slate-50 rounded-xl outline-none" placeholder="Nama Member">
                            <input id="reg-email" class="w-full p-3 bg-slate-50 rounded-xl outline-none" placeholder="Email Member">
                            <select id="reg-level" class="w-full p-3 bg-slate-50 rounded-xl outline-none">
                                <option value="Bronze">Bronze (1 Juta)</option>
                                <option value="Silver">Silver (3 Juta)</option>
                                <option value="Gold">Gold (7 Juta)</option>
                                <option value="Platinum">Platinum (15 Juta)</option>
                            </select>
                            <select id="reg-upline" class="w-full p-3 bg-slate-50 rounded-xl outline-none">
                                <option value="">Tanpa Upline (Pusat)</option>
                            </select>
                            <button onclick="registerMember()" id="btn-reg" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">DAFTARKAN</button>
                        </div>
                    </div>

                    <div class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="p-4">Nama</th>
                                    <th class="p-4">Paket</th>
                                    <th class="p-4">Profit</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y">
                                </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // MASUKKAN CONFIG FIREBASE ANDA DI SINI
        const firebaseConfig = {
            apiKey: "PASTE_DI_SINI",
            authDomain: "PASTE_DI_SINI",
            projectId: "PASTE_DI_SINI",
            storageBucket: "PASTE_DI_SINI",
            messagingSenderId: "PASTE_DI_SINI",
            appId: "PASTE_DI_SINI"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const PACKAGES = {
            'Bronze': { profit: 150000, bonus: 100000 },
            'Silver': { profit: 500000, bonus: 300000 },
            'Gold': { profit: 1250000, bonus: 700000 },
            'Platinum': { profit: 3000000, bonus: 1500000 }
        };

        function checkAdmin() {
            const key = document.getElementById('admin-key').value;
            if(key === "RVS2024_OWNER") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                loadData();
            } else { alert("Kunci Salah!"); }
        }

        async function loadData() {
            auth.signInAnonymously();
            db.collection("members").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                let members = [];
                let totalProfit = 0;
                let tableHtml = "";
                let uplineHtml = '<option value="">Tanpa Upline (Pusat)</option>';

                snapshot.forEach(doc => {
                    const m = doc.data();
                    m.id = doc.id;
                    members.push(m);
                    totalProfit += (m.totalEarnings || 0);
                    
                    tableHtml += `<tr>
                        <td class="p-4 font-bold">${m.name}<br><span class="text-xs text-slate-400 font-normal">${m.email}</span></td>
                        <td class="p-4 uppercase text-xs font-black text-indigo-600">${m.level}</td>
                        <td class="p-4 font-bold text-emerald-600">${new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(m.totalEarnings)}</td>
                    </tr>`;
                    
                    uplineHtml += `<option value="${m.id}">${m.name}</option>`;
                });

                document.getElementById('table-body').innerHTML = tableHtml;
                document.getElementById('reg-upline').innerHTML = uplineHtml;
                document.getElementById('stat-members').innerText = members.length + " Orang";
                document.getElementById('stat-profit').innerText = new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(totalProfit);
                lucide.createIcons();
            });
        }

        async function registerMember() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const level = document.getElementById('reg-level').value;
            const uplineId = document.getElementById('reg-upline').value;

            if(!name || !email) return alert("Isi nama dan email!");

            const pkg = PACKAGES[level];
            const newMember = {
                name, email, level,
                totalEarnings: pkg.profit,
                uplineId: uplineId || null,
                createdAt: Date.now()
            };

            await db.collection("members").add(newMember);

            if(uplineId) {
                await db.collection("members").doc(uplineId).update({
                    totalEarnings: firebase.firestore.FieldValue.increment(pkg.bonus)
                });
            }

            alert("Berhasil!");
            document.getElementById('reg-name').value = "";
            document.getElementById('reg-email').value = "";
        }

        lucide.createIcons();
    </script>
</body>
  </html>
